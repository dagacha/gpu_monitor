[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "gpu-monitor"
version = "0.1.0"
requires-python = ">=3.10,<3.16"
dependencies = [
    "textual>=0.88.0",
    "psutil>=6.0.0",
    "pywin32>=308; sys_platform == 'win32'",
    "pythonnet>=3.0.5; sys_platform == 'win32'",
    "nvidia-ml-py>=12.560.30; sys_platform == 'win32'",
]
